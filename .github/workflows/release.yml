name: Release

# Only a vX.Y.Z tag: v0.1.0-rc1 does not match. The first step checks it again
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tagged commit is in master
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "::error::$GITHUB_REF_NAME is not on master: merge the pull request first."
            exit 1
          }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check the tag and read the notes
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          head -n 1 "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/title.txt"
          tail -n +2 "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/body.md"

      - run: pnpm install --frozen-lockfile
      - run: pnpm codecheck
      - run: pnpm lint
      - run: pnpm prettier
      - run: pnpm test:ci

      - name: Build the x64 tarball (arm64 is experimental and not published)
        run: pnpm package x64

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "$(cat "$RUNNER_TEMP/title.txt")" \
            --notes-file "$RUNNER_TEMP/body.md"
